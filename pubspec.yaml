name: farm_match
description: Farm Match — a portrait triple-match tile game for iOS and Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.4.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  http: ^1.4.0
  in_app_purchase: ^3.2.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/default_config.json
    - assets/images/home-title.png
    - assets/images/home-farmer.png
    - assets/images/items/
    - assets/images/ui/
    - assets/audio/
